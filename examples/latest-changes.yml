name: Latest Changes

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number to reprocess
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: latest-changes-${{ github.repository }}
  queue: max
  cancel-in-progress: false

jobs:
  update:
    name: Process pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pin main to the reviewed release's full commit SHA before production use.
      # No checkout: never run code from the pull request with this token.
      - uses: hainuoli/latest-changes@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request: ${{ inputs.pull-request }}
